name: Career History Rolling Sync

on:
  schedule:
    - cron: '0 5 * * 0'  # 05:00 UTC weekly, Sundays
  workflow_dispatch: {}

concurrency:
  group: career-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: maxBreak
        run: pip install -r requirements.txt

      - name: Restore rolling-sweep cursor
        uses: actions/cache/restore@v4
        with:
          path: maxBreak/career_sync_cursor.json
          key: career-sync-cursor-${{ github.run_id }}
          restore-keys: |
            career-sync-cursor-

      - name: Run career history rolling sync
        working-directory: maxBreak
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py sync_career_history --top 128 --batch-size 40

      - name: Save rolling-sweep cursor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: maxBreak/career_sync_cursor.json
          key: career-sync-cursor-${{ github.run_id }}
